openapi: 3.1.0
info:
  title: Terminal302 API
  version: 0.1.0
  description: API REST inicial para autenticacion de Terminal302.
servers:
  - url: http://localhost:8302/api
    description: Docker local
  - url: /api
    description: Mismo host
tags:
  - name: Autenticacion
    description: Login, sesion y cambio obligatorio de contrasena inicial.
  - name: Administracion de usuarios
    description: Gestion de usuarios disponible solo para administradores.
  - name: Operadores
    description: Registro y administracion de operadores de transporte.
  - name: Rutas del operador
    description: Gestion de rutas asignadas al operador del empresario autenticado.
  - name: Buses
    description: Gestion de buses del operador del empresario autenticado.
  - name: Horarios
    description: Gestion administrativa y consulta de horarios de salida.
  - name: Ventas de horarios
    description: Soporte operativo para consulta y cierre de ciclos de venta.
  - name: Tickets
    description: Venta y listado de tickets emitidos por vendedores.
  - name: Validaciones
    description: Validacion interna autenticada de tickets para abordaje.
  - name: Plantillas de ticket
    description: Gestion administrativa de plantillas visuales para tickets.
  - name: Rutas
    description: Catalogo administrativo de rutas de transporte.
paths:
  /login:
    post:
      tags:
        - Autenticacion
      summary: Iniciar sesion
      description: Valida credenciales, rechaza usuarios inactivos y devuelve un token Bearer de Sanctum.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              admin:
                summary: Administrador inicial
                value:
                  email: admin@terminal302.local
                  password: TEMPORAL
      responses:
        '200':
          description: Login exitoso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '403':
          description: Usuario inactivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Error de validacion o credenciales invalidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /logout:
    post:
      tags:
        - Autenticacion
      summary: Cerrar sesion
      description: Invalida el token Bearer actual.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sesion cerrada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /user:
    get:
      tags:
        - Autenticacion
      summary: Obtener usuario autenticado
      description: Devuelve el usuario asociado al token Bearer actual.
      operationId: authenticatedUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResourceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /change-initial-password:
    post:
      tags:
        - Autenticacion
      summary: Cambiar contrasena inicial obligatoria
      description: Requiere la contrasena actual y una nueva contrasena confirmada. Marca must_change_password como false.
      operationId: changeInitialPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeInitialPasswordRequest'
            examples:
              cambioInicial:
                value:
                  current_password: TEMPORAL
                  password: NuevaClave123
                  password_confirmation: NuevaClave123
      responses:
        '200':
          description: Contrasena actualizada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeInitialPasswordResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: Error de validacion o contrasena actual invalida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /operador/me:
    get:
      tags:
        - Operadores
      summary: Obtener operador propio
      description: Devuelve el operador asociado al empresario autenticado. Si el operador esta desactivado, responde 403.
      operationId: operadorMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Operador del empresario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperadorResourceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /operador:
    post:
      tags:
        - Operadores
      summary: Registrar operador propio
      description: Crea el operador del empresario autenticado y lo deja activo automaticamente.
      operationId: operadorCreate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperadorRequest'
            examples:
              empresa:
                value:
                  tipo_operador_id: 1
                  nombre: Transportes Central
                  razon_social: Transportes Central S.A.
                  representante_legal: Maria Lopez
                  documento: null
                  telefono: 2222-3333
                  correo: contacto@central.test
                  direccion: Terminal central
              persona:
                value:
                  tipo_operador_id: 2
                  nombre: Juan Perez
                  documento: null
                  telefono: 7777-8888
                  correo: juan@example.test
                  direccion: San Salvador
      responses:
        '201':
          description: Operador registrado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperadorMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: El empresario ya tiene operador registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Error de validacion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Falta el estado activo en catalogos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /operador/{id}:
    put:
      tags:
        - Operadores
      summary: Actualizar operador propio
      description: Actualiza el operador si pertenece al empresario autenticado.
      operationId: operadorUpdate
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OperadorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperadorRequest'
      responses:
        '200':
          description: Operador actualizado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperadorMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Error de validacion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /operador/rutas:
    get:
      tags:
        - Rutas del operador
      summary: Listar rutas asignadas al operador
      description: Devuelve asignaciones paginadas del operador del empresario autenticado.
      operationId: operadorListRutas
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 15
      responses:
        '200':
          description: Lista paginada de rutas asignadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperadorRutaPaginatedResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Rutas del operador
      summary: Asignar ruta al operador
      description: Asigna una ruta activa del catalogo al operador del empresario autenticado.
      operationId: operadorCreateRuta
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperadorRutaRequest'
            example:
              ruta_id: 1
      responses:
        '201':
          description: Ruta asignada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperadorRutaMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La ruta ya esta asignada al operador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Error de validacion o ruta inactiva.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Falta el estado activo en catalogos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /operador/rutas/{id}:
    delete:
      tags:
        - Rutas del operador
      summary: Eliminar ruta asignada
      description: Elimina fisicamente una asignacion propia del operador autenticado.
      operationId: operadorDeleteRuta
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OperadorRutaId'
      responses:
        '200':
          description: Ruta asignada eliminada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /operador/rutas/{id}/toggle-status:
    patch:
      tags:
        - Rutas del operador
      summary: Alternar estado de ruta asignada
      description: Cambia automaticamente entre activo e inactivo sin recibir body.
      operationId: operadorToggleRutaStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OperadorRutaId'
      responses:
        '200':
          description: Estado de la ruta asignada actualizado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperadorRutaMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Falta el estado activo o inactivo/desactivado en catalogos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /operador/buses:
    get:
      tags:
        - Buses
      summary: Listar buses del operador
      description: Devuelve buses paginados del operador del empresario autenticado. Permite filtros por ruta, estado y busqueda por placa, marca o nombre de unidad.
      operationId: operadorListBuses
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 15
        - in: query
          name: ruta_id
          schema:
            type: integer
          example: 1
        - in: query
          name: estado_id
          schema:
            type: integer
          example: 1
        - in: query
          name: search
          schema:
            type: string
          example: AB-123
      responses:
        '200':
          description: Lista paginada de buses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusPaginatedResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Buses
      summary: Registrar bus del operador
      description: Crea un bus propio del operador autenticado y lo deja activo automaticamente. La ruta debe estar activa y asignada activamente al operador.
      operationId: operadorCreateBus
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusRequest'
            example:
              ruta_id: 1
              placa: AB-123
              marca: Mercedes
              nombre_unidad: Unidad Centro
              capacidad: 45
              tipo_bus_id: 1
      responses:
        '201':
          description: Bus registrado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Error de validacion, ruta inactiva o tipo de bus inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Falta el estado activo en catalogos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /operador/buses/{id}:
    put:
      tags:
        - Buses
      summary: Actualizar bus del operador
      description: Actualiza un bus si pertenece al operador del empresario autenticado. No permite cambiar operador_id ni estado_id.
      operationId: operadorUpdateBus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BusId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusRequest'
      responses:
        '200':
          description: Bus actualizado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Error de validacion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /operador/buses/{id}/toggle-status:
    patch:
      tags:
        - Buses
      summary: Alternar estado de bus
      description: Cambia automaticamente entre activo e inactivo sin recibir body.
      operationId: operadorToggleBusStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BusId'
      responses:
        '200':
          description: Estado del bus actualizado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Falta el estado activo o inactivo/desactivado en catalogos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /operador/horarios/rutas:
    get:
      tags:
        - Horarios
      summary: Listar rutas con horarios del operador
      description: Devuelve rutas activas asignadas activamente al operador autenticado.
      operationId: operadorHorarioRutas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Rutas disponibles para consulta de horarios.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RutasListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /operador/horarios/rutas/{id}:
    get:
      tags:
        - Horarios
      summary: Listar dias con horarios activos del operador
      description: Devuelve solo los dias que tienen horarios activos para la ruta y operador autenticado.
      operationId: operadorHorarioDiasPorRuta
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RutaId'
      responses:
        '200':
          description: Dias con horarios.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HorarioDiasResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Ruta inactiva.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /operador/horarios:
    get:
      tags:
        - Horarios
      summary: Listar horarios activos del operador por ruta y dia
      operationId: operadorHorariosPorRutaDia
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: ruta_id
          required: true
          schema:
            type: integer
          example: 1
        - in: query
          name: dia_id
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Horarios activos del operador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HorariosListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Error de validacion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /vendedor/rutas-disponibles:
    get:
      tags:
        - Ventas de horarios
      summary: Listar rutas disponibles para venta
      description: Devuelve rutas activas que tienen al menos un horario activo asociado.
      operationId: vendedorRutasDisponibles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Rutas disponibles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RutasListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /vendedor/rutas/{id}/horarios-disponibles:
    get:
      tags:
        - Ventas de horarios
      summary: Consultar horarios disponibles de ruta
      description: Devuelve el horario en meta y el proximo a salir. Crea automaticamente ventas_horarios para la fecha operativa actual si no existen.
      operationId: vendedorHorariosDisponiblesPorRuta
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RutaId'
      responses:
        '200':
          description: Horarios disponibles para venta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HorariosDisponiblesVentaResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Ruta inactiva o no se pudo determinar horario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /vendedor/ventas-horarios/{id}/cerrar:
    patch:
      tags:
        - Ventas de horarios
      summary: Cerrar venta de horario
      description: Cierra el ciclo operativo de venta de un horario. El vendedor autenticado se asigna automaticamente.
      operationId: vendedorCerrarVentaHorario
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VentaHorarioId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CerrarVentaHorarioRequest'
            example:
              motivo_cierre: Unidad completa
      responses:
        '200':
          description: Venta de horario cerrada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VentaHorarioMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La venta de horario ya esta cerrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Error de validacion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /vendedor/tickets:
    get:
      tags:
        - Tickets
      summary: Listar tickets vendidos
      description: Devuelve tickets paginados vendidos por el vendedor autenticado.
      operationId: vendedorListTickets
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 15
        - in: query
          name: venta_horario_id
          schema:
            type: integer
        - in: query
          name: estado_id
          schema:
            type: integer
        - in: query
          name: codigo_ticket
          schema:
            type: string
        - in: query
          name: tipo_envio_id
          schema:
            type: integer
      responses:
        '200':
          description: Lista paginada de tickets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketPaginatedResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Tickets
      summary: Vender tickets
      description: Genera tickets sobre una venta_horario activa y actualiza contadores de venta.
      operationId: vendedorCreateTickets
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketStoreRequest'
            examples:
              impreso:
                value:
                  venta_horario_id: 12
                  cantidad: 2
                  tipo_envio_id: 1
              digital:
                value:
                  venta_horario_id: 12
                  cantidad: 3
                  tipo_envio_id: 2
                  correo_destino: cliente@email.com
                  telefono_destino: '77777777'
      responses:
        '201':
          description: Tickets generados correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSaleResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Venta cerrada o capacidad alcanzada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Error de validacion o regla de negocio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Falta un estado requerido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /validador/tickets/validar:
    post:
      tags:
        - Validaciones
      summary: Validar ticket internamente
      description: Valida un ticket por codigo, registra auditoria y cambia su estado a validado.
      operationId: validadorValidarTicket
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidarTicketRequest'
            example:
              codigo_ticket: TKT-20260630-ABCD123456
              observacion: Abordaje confirmado
      responses:

openapi: 3.1.0
info:
  title: Terminal302 API
  version: 0.1.0
  description: API REST inicial para autenticacion de Terminal302.
servers:
  - url: http://localhost:8302/api
    description: Docker local
  - url: /api
    description: Mismo host
tags:
  - name: Autenticacion
    description: Login, sesion y cambio obligatorio de contrasena inicial.
  - name: Administracion de usuarios
    description: Gestion de usuarios disponible solo para administradores.
paths:
  /login:
    post:
      tags:
        - Autenticacion
      summary: Iniciar sesion
      description: Valida credenciales, rechaza usuarios inactivos y devuelve un token Bearer de Sanctum.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              admin:
                summary: Administrador inicial
                value:
                  email: admin@terminal302.local
                  password: TEMPORAL
      responses:
        '200':
          description: Login exitoso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '403':
          description: Usuario inactivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Error de validacion o credenciales invalidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /logout:
    post:
      tags:
        - Autenticacion
      summary: Cerrar sesion
      description: Invalida el token Bearer actual.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sesion cerrada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /user:
    get:
      tags:
        - Autenticacion
      summary: Obtener usuario autenticado
      description: Devuelve el usuario asociado al token Bearer actual.
      operationId: authenticatedUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResourceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /change-initial-password:
    post:
      tags:
        - Autenticacion
      summary: Cambiar contrasena inicial obligatoria
      description: Requiere la contrasena actual y una nueva contrasena confirmada. Marca must_change_password como false.
      operationId: changeInitialPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeInitialPasswordRequest'
            examples:
              cambioInicial:
                value:
                  current_password: TEMPORAL
                  password: NuevaClave123
                  password_confirmation: NuevaClave123
      responses:
        '200':
          description: Contrasena actualizada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeInitialPasswordResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: Error de validacion o contrasena actual invalida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /admin/users:
    get:
      tags:
        - Administracion de usuarios
      summary: Listar usuarios
      description: Devuelve usuarios paginados con rol y estado.
      operationId: adminListUsers
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 15
      responses:
        '200':
          description: Lista paginada de usuarios.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPaginatedResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Administracion de usuarios
      summary: Crear usuario
      description: Crea un usuario, genera una contrasena temporal y envia sus credenciales por correo.
      operationId: adminCreateUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
            examples:
              vendedor:
                value:
                  name: Maria Perez
                  email: maria@example.test
                  role_id: 3
      responses:
        '201':
          description: Usuario creado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Error de validacion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /admin/users/{id}:
    get:
      tags:
        - Administracion de usuarios
      summary: Ver usuario
      operationId: adminShowUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Detalle de usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResourceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Administracion de usuarios
      summary: Actualizar usuario
      operationId: adminUpdateUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
      responses:
        '200':
          description: Usuario actualizado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Error de validacion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /admin/users/{id}/reset-password:
    patch:
      tags:
        - Administracion de usuarios
      summary: Restablecer contrasena temporal
      description: Genera una nueva contrasena temporal, marca cambio obligatorio y envia el correo al usuario.
      operationId: adminResetUserPassword
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Contrasena restablecida correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/users/{id}/toggle-status:
    patch:
      tags:
        - Administracion de usuarios
      summary: Alternar estado de usuario
      description: Cambia automaticamente entre estado activo e inactivo/desactivado sin eliminar al usuario.
      operationId: adminToggleUserStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Estado alternado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Falta el estado activo o inactivo/desactivado en catalogos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
components:
  parameters:
    UserId:
      in: path
      name: id
      required: true
      schema:
        type: integer
      example: 1
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  responses:
    Unauthenticated:
      description: Token ausente, invalido o expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: Unauthenticated.
    Forbidden:
      description: El usuario no tiene permisos o debe cambiar su contrasena inicial.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          examples:
            noAdmin:
              value:
                message: No tiene permisos para gestionar usuarios.
            mustChangePassword:
              value:
                message: Debe cambiar la contrasena inicial antes de continuar.
    NotFound:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: Not Found
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@terminal302.local
        password:
          type: string
          format: password
          example: TEMPORAL
    ChangeInitialPasswordRequest:
      type: object
      required:
        - current_password
        - password
        - password_confirmation
      properties:
        current_password:
          type: string
          format: password
          example: TEMPORAL
        password:
          type: string
          format: password
          minLength: 8
          description: Debe contener letras y numeros.
          example: NuevaClave123
        password_confirmation:
          type: string
          format: password
          example: NuevaClave123
    AuthResponse:
      type: object
      required:
        - token_type
        - access_token
        - user
      properties:
        token_type:
          type: string
          example: Bearer
        access_token:
          type: string
          example: 1|token-generado-por-sanctum
        user:
          $ref: '#/components/schemas/User'
    ChangeInitialPasswordResponse:
      type: object
      required:
        - message
        - user
      properties:
        message:
          type: string
          example: Contrasena actualizada correctamente.
        user:
          $ref: '#/components/schemas/User'
    UserResourceResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/User'
    UserPaginatedResponse:
      type: object
      required:
        - users
        - pagination
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          type: object
          required:
            - page
            - per_page
            - total
            - last_page
          properties:
            page:
              type: integer
              example: 1
            per_page:
              type: integer
              example: 15
            total:
              type: integer
              example: 25
            last_page:
              type: integer
              example: 2
    AdminUserRequest:
      type: object
      required:
        - name
        - email
        - role_id
      properties:
        name:
          type: string
          maxLength: 255
          example: Maria Perez
        email:
          type: string
          format: email
          maxLength: 255
          example: maria@example.test
        role_id:
          type: integer
          example: 3
    AdminUserMutationResponse:
      type: object
      required:
        - message
        - user
      properties:
        message:
          type: string
          example: Usuario actualizado correctamente.
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required:
        - id
        - name
        - email
        - role
        - estado
        - must_change_password
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Administrador Terminal302
        email:
          type: string
          format: email
          example: admin@terminal302.local
        role:
          $ref: '#/components/schemas/CatalogItem'
        estado:
          $ref: '#/components/schemas/CatalogItem'
        must_change_password:
          type: boolean
          example: true
        created_at:
          type:
            - string
            - 'null'
          format: date-time
          example: '2026-06-23T19:00:00.000000Z'
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
          example: '2026-06-23T19:00:00.000000Z'
    CatalogItem:
      type: object
      properties:
        id:
          type:
            - integer
            - 'null'
          example: 1
        nombre:
          type:
            - string
            - 'null'
          example: administrador
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Sesion cerrada correctamente.
    ValidationErrorResponse:
      type: object
      required:
        - message
        - errors
      properties:
        message:
          type: string
          example: Las credenciales no son validas.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email:
              - Las credenciales no son validas.

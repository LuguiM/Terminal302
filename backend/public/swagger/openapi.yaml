        '422':
          description: Error de validacion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /admin/users/{id}:
    get:
      tags:
        - Administracion de usuarios
      summary: Ver usuario
      operationId: adminShowUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Detalle de usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResourceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Administracion de usuarios
      summary: Actualizar usuario
      operationId: adminUpdateUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
      responses:
        '200':
          description: Usuario actualizado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Error de validacion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /admin/users/{id}/reset-password:
    patch:
      tags:
        - Administracion de usuarios
      summary: Restablecer contrasena temporal
      description: Genera una nueva contrasena temporal, marca cambio obligatorio y envia el correo al usuario.
      operationId: adminResetUserPassword
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Contrasena restablecida correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/users/{id}/toggle-status:
    patch:
      tags:
        - Administracion de usuarios
      summary: Alternar estado de usuario
      description: Cambia automaticamente entre estado activo e inactivo/desactivado sin eliminar al usuario.
      operationId: adminToggleUserStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Estado alternado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Falta el estado activo o inactivo/desactivado en catalogos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

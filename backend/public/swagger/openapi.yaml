openapi: 3.1.0
info:
  title: Terminal302 API
  version: 0.1.0
  description: API REST inicial para autenticacion de Terminal302.
servers:
  - url: http://localhost:8302/api
    description: Docker local
  - url: /api
    description: Mismo host
tags:
  - name: Autenticacion
    description: Login, sesion y cambio obligatorio de contrasena inicial.
  - name: Administracion de usuarios
    description: Gestion de usuarios disponible solo para administradores.
  - name: Operadores
    description: Registro y administracion de operadores de transporte.
  - name: Rutas
    description: Catalogo administrativo de rutas de transporte.
paths:
  /login:
    post:
      tags:
        - Autenticacion
      summary: Iniciar sesion
      description: Valida credenciales, rechaza usuarios inactivos y devuelve un token Bearer de Sanctum.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              admin:
                summary: Administrador inicial
                value:
                  email: admin@terminal302.local
                  password: TEMPORAL
      responses:
        '200':
          description: Login exitoso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '403':
          description: Usuario inactivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Error de validacion o credenciales invalidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /logout:
    post:
      tags:
        - Autenticacion
      summary: Cerrar sesion
      description: Invalida el token Bearer actual.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sesion cerrada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /user:
    get:
      tags:
        - Autenticacion
      summary: Obtener usuario autenticado
      description: Devuelve el usuario asociado al token Bearer actual.
      operationId: authenticatedUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResourceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /change-initial-password:
    post:
      tags:
        - Autenticacion
      summary: Cambiar contrasena inicial obligatoria
      description: Requiere la contrasena actual y una nueva contrasena confirmada. Marca must_change_password como false.
      operationId: changeInitialPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeInitialPasswordRequest'
            examples:
              cambioInicial:
                value:
                  current_password: TEMPORAL
                  password: NuevaClave123
                  password_confirmation: NuevaClave123
      responses:
        '200':
          description: Contrasena actualizada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeInitialPasswordResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: Error de validacion o contrasena actual invalida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /operador/me:
    get:
      tags:
        - Operadores
      summary: Obtener operador propio
      description: Devuelve el operador asociado al empresario autenticado. Si el operador esta desactivado, responde 403.
      operationId: operadorMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Operador del empresario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperadorResourceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /operador:
    post:
      tags:
        - Operadores
      summary: Registrar operador propio
      description: Crea el operador del empresario autenticado y lo deja activo automaticamente.
      operationId: operadorCreate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperadorRequest'
            examples:
              empresa:
                value:
                  tipo_operador_id: 1
                  nombre: Transportes Central
                  razon_social: Transportes Central S.A.
                  representante_legal: Maria Lopez
                  documento: null
                  telefono: 2222-3333
                  correo: contacto@central.test
                  direccion: Terminal central
              persona:
                value:
                  tipo_operador_id: 2
                  nombre: Juan Perez
                  documento: null
                  telefono: 7777-8888
                  correo: juan@example.test
                  direccion: San Salvador
      responses:
        '201':
          description: Operador registrado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperadorMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: El empresario ya tiene operador registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Error de validacion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Falta el estado activo en catalogos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /operador/{id}:
    put:
      tags:
        - Operadores
      summary: Actualizar operador propio
      description: Actualiza el operador si pertenece al empresario autenticado.
      operationId: operadorUpdate
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OperadorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperadorRequest'
      responses:
        '200':
          description: Operador actualizado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperadorMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Error de validacion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /admin/operadores:
    get:
      tags:
        - Operadores
      summary: Listar operadores
      description: Devuelve operadores paginados con empresario, tipo y estado. Solo administradores.
      operationId: adminListOperadores
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 15
      responses:
        '200':
          description: Lista paginada de operadores.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperadorPaginatedResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/operadores/{id}:
    get:
      tags:
        - Operadores
      summary: Ver operador
      operationId: adminShowOperador
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OperadorId'
      responses:
        '200':
          description: Detalle de operador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperadorResourceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/operadores/{id}/toggle-status:
    patch:
      tags:
        - Operadores
      summary: Alternar estado de operador
      description: Si el operador esta activo exige motivo de desactivacion; si esta inactivo lo reactiva y limpia el motivo.
      operationId: adminToggleOperadorStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OperadorId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleOperadorStatusRequest'
            example:
              motivo_desactivacion: Documentacion vencida
      responses:
        '200':
          description: Estado del operador actualizado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperadorMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Falta motivo de desactivacion o hay error de validacion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Falta el estado activo o inactivo/desactivado en catalogos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /admin/rutas:
    get:
      tags:
        - Rutas
      summary: Listar rutas
      description: Devuelve rutas paginadas con su estado. Solo administradores.
      operationId: adminListRutas
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 15
      responses:
        '200':
          description: Lista paginada de rutas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RutaPaginatedResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Rutas
      summary: Crear ruta
      description: Crea una ruta y la deja activa automaticamente.
      operationId: adminCreateRuta
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RutaRequest'
            example:
              ruta: 301-A
              denominacion: Usulutan - San Salvador
              tarifa: 1.50
      responses:
        '201':
          description: Ruta creada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RutaMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Error de validacion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Falta el estado activo en catalogos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /admin/rutas/{id}:
    put:
      tags:
        - Rutas
      summary: Actualizar ruta
      operationId: adminUpdateRuta
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RutaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RutaRequest'
      responses:
        '200':
          description: Ruta actualizada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RutaMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Error de validacion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
    delete:
      tags:
        - Rutas
      summary: Eliminar ruta
      description: Elimina fisicamente la ruta de la base de datos.
      operationId: adminDeleteRuta
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RutaId'
      responses:
        '200':
          description: Ruta eliminada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/rutas/{id}/toggle-status:
    patch:
      tags:
        - Rutas
      summary: Alternar estado de ruta
      description: Cambia automaticamente entre estado activo e inactivo/desactivado sin recibir body.
      operationId: adminToggleRutaStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RutaId'
      responses:
        '200':
          description: Estado de la ruta actualizado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RutaMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Falta el estado activo o inactivo/desactivado en catalogos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /admin/users:
    get:
      tags:
        - Administracion de usuarios
      summary: Listar usuarios
      description: Devuelve usuarios paginados con rol y estado.
      operationId: adminListUsers
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 15
      responses:
        '200':
          description: Lista paginada de usuarios.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPaginatedResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Administracion de usuarios
      summary: Crear usuario
      description: Crea un usuario, genera una contrasena temporal y envia sus credenciales por correo.
      operationId: adminCreateUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
            examples:
              vendedor:
                value:
                  name: Maria Perez
                  email: maria@example.test
                  role_id: 3
      responses:
        '201':
          description: Usuario creado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Error de validacion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /admin/users/{id}:
    get:
      tags:
        - Administracion de usuarios
      summary: Ver usuario
      operationId: adminShowUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Detalle de usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResourceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Administracion de usuarios
      summary: Actualizar usuario
      operationId: adminUpdateUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
      responses:
        '200':
          description: Usuario actualizado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Error de validacion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /admin/users/{id}/reset-password:
    patch:
      tags:
        - Administracion de usuarios
      summary: Restablecer contrasena temporal
      description: Genera una nueva contrasena temporal, marca cambio obligatorio y envia el correo al usuario.
      operationId: adminResetUserPassword
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Contrasena restablecida correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/users/{id}/toggle-status:
    patch:
      tags:
        - Administracion de usuarios
      summary: Alternar estado de usuario
      description: Cambia automaticamente entre estado activo e inactivo/desactivado sin eliminar al usuario.
      operationId: adminToggleUserStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Estado alternado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Falta el estado activo o inactivo/desactivado en catalogos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
components:
  parameters:
    UserId:
      in: path
      name: id
      required: true
      schema:
        type: integer
      example: 1
    OperadorId:
      in: path
      name: id
      required: true
      schema:
        type: integer
      example: 1
    RutaId:
      in: path
      name: id
      required: true
      schema:
        type: integer
      example: 1
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  responses:
    Unauthenticated:
      description: Token ausente, invalido o expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: Unauthenticated.
    Forbidden:
      description: El usuario no tiene permisos o debe cambiar su contrasena inicial.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          examples:
            noAdmin:
              value:
                message: No tiene permisos para gestionar usuarios.
            mustChangePassword:
              value:
                message: Debe cambiar la contrasena inicial antes de continuar.
    NotFound:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: Not Found
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@terminal302.local
        password:
          type: string
          format: password
          example: TEMPORAL
    ChangeInitialPasswordRequest:
      type: object
      required:
        - current_password
        - password
        - password_confirmation
      properties:
        current_password:
          type: string
          format: password
          example: TEMPORAL
        password:
          type: string
          format: password
          minLength: 8
          description: Debe contener letras y numeros.
          example: NuevaClave123
        password_confirmation:
          type: string
          format: password
          example: NuevaClave123
    AuthResponse:
      type: object
      required:
        - token_type
        - access_token
        - user
      properties:
        token_type:
          type: string
          example: Bearer
        access_token:
          type: string
          example: 1|token-generado-por-sanctum
        user:
          $ref: '#/components/schemas/User'
    ChangeInitialPasswordResponse:
      type: object
      required:
        - message
        - user
      properties:
        message:
          type: string
          example: Contrasena actualizada correctamente.
        user:
          $ref: '#/components/schemas/User'
    UserResourceResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/User'
    UserPaginatedResponse:
      type: object
      required:
        - users
        - pagination
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          type: object
          required:
            - page
            - per_page
            - total
            - last_page
          properties:
            page:
              type: integer
              example: 1
            per_page:
              type: integer
              example: 15
            total:
              type: integer
              example: 25
            last_page:
              type: integer
              example: 2
    AdminUserRequest:
      type: object
      required:
        - name
        - email
        - role_id
      properties:
        name:
          type: string
          maxLength: 255
          example: Maria Perez
        email:
          type: string
          format: email
          maxLength: 255
          example: maria@example.test
        role_id:
          type: integer
          example: 3
    AdminUserMutationResponse:
      type: object
      required:
        - message
        - user
      properties:
        message:
          type: string
          example: Usuario actualizado correctamente.
        user:
          $ref: '#/components/schemas/User'
    OperadorRequest:
      type: object
      required:
        - tipo_operador_id
        - nombre
        - telefono
        - correo
        - direccion
      properties:
        tipo_operador_id:
          type: integer
          example: 1
        nombre:
          type: string
          maxLength: 255
          example: Transportes Central
        razon_social:
          type:
            - string
            - 'null'
          maxLength: 255
          description: Requerido cuando el tipo de operador es empresa.
          example: Transportes Central S.A.
        representante_legal:
          type:
            - string
            - 'null'
          maxLength: 255
          description: Requerido cuando el tipo de operador es empresa.
          example: Maria Lopez
        documento:
          type:
            - string
            - 'null'
          maxLength: 255
          example: null
        telefono:
          type: string
          maxLength: 50
          example: 2222-3333
        correo:
          type: string
          format: email
          maxLength: 255
          example: contacto@central.test
        direccion:
          type: string
          maxLength: 255
          example: Terminal central
    ToggleOperadorStatusRequest:
      type: object
      properties:
        motivo_desactivacion:
          type:
            - string
            - 'null'
          maxLength: 1000
          description: Obligatorio al desactivar un operador activo; se ignora al reactivar.
          example: Documentacion vencida
    OperadorMutationResponse:
      type: object
      required:
        - message
        - operador
      properties:
        message:
          type: string
          example: Operador actualizado correctamente.
        operador:
          $ref: '#/components/schemas/Operador'
    OperadorResourceResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Operador'
    OperadorPaginatedResponse:
      type: object
      required:
        - operadores
        - pagination
      properties:
        operadores:
          type: array
          items:

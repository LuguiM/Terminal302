      bearerFormat: Sanctum
  responses:
    Unauthenticated:
      description: Token ausente, invalido o expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: Unauthenticated.
    Forbidden:
      description: El usuario no tiene permisos o debe cambiar su contrasena inicial.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          examples:
            noAdmin:
              value:
                message: No tiene permisos para gestionar usuarios.
            mustChangePassword:
              value:
                message: Debe cambiar la contrasena inicial antes de continuar.
    NotFound:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
